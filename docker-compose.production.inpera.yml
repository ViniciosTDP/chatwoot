# Chatwoot Inpera — production stack on HostGator (4 GB RAM / 2 vCPUs).
# Build the image OFF the VPS, then: gunzip -c chatwoot-inpera-prod.tar.gz | docker load
# Usage on VPS:
#   docker compose -f docker-compose.production.inpera.yml up -d
# Docker Compose v2 is required; resource limits work without Swarm.

services:
  pdf:
    image: chatwoot-report-pdf:prod
    environment:
      PDF_SERVICE_TOKEN: ${PDF_SERVICE_TOKEN:?Configure PDF_SERVICE_TOKEN in .env}
    init: true
    restart: always
    cap_add: [SYS_ADMIN]
    read_only: true
    tmpfs: ['/tmp:size=256m,uid=1000,gid=1000']
    shm_size: 128m
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    networks: [pdf_internal]
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3005/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 20s
      start_period: 30s
      retries: 3

  report-worker:
    image: chatwoot-inpera:prod
    env_file: .env
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      PDF_SERVICE_URL: http://pdf:3005
      PDF_SERVICE_TOKEN: ${PDF_SERVICE_TOKEN:?Configure PDF_SERVICE_TOKEN in .env}
      RAILS_MAX_THREADS: 1
      SIDEKIQ_CONCURRENCY: 1
      # One PDF job plus SidekiqAlive's auxiliary threads share this pool.
      DB_POOL_SIZE: 5
    command: ['bundle', 'exec', 'sidekiq', '-q', 'report_exports', '-c', '1']
    volumes:
      - storage_data:/app/storage
    depends_on:
      pdf:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks: [default, pdf_internal]
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5

  rails:
    image: chatwoot-inpera:prod
    env_file: .env
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-0}
      - RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-2}
      - SIDEKIQ_CONCURRENCY=${SIDEKIQ_CONCURRENCY:-2}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    volumes:
      - storage_data:/app/storage
      # Override image scripts if built from a Windows checkout with CRLF
      - ./docker/entrypoints:/app/docker/entrypoints:ro
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'
    restart: always
    mem_limit: 640m
    memswap_limit: 896m

  sidekiq:
    image: chatwoot-inpera:prod
    env_file: .env
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-0}
      - RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-2}
      - SIDEKIQ_CONCURRENCY=${SIDEKIQ_CONCURRENCY:-2}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    volumes:
      - storage_data:/app/storage
    depends_on:
      - postgres
      - redis
    restart: always
    mem_limit: 1024m
    memswap_limit: 1280m

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-evolution-db.sql:/docker-entrypoint-initdb.d/01-init-evolution-db.sql:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-chatwoot}
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - max_connections=50
    mem_limit: 384m
    memswap_limit: 512m

  redis:
    image: redis:alpine
    restart: always
    command:
      - sh
      - -c
      - redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    mem_limit: 256m
    memswap_limit: 384m

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - '8080:8080'
    environment:
      - SERVER_URL=${EVOLUTION_API_PUBLIC_URL:-http://129.121.37.112:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution_change_me}@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=chatwoot_evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/2
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
      - LOG_LEVEL=ERROR,WARN,INFO
      - WPP_LID_MODE=false
    volumes:
      - evolution_instances:/evolution/instances
    # Preserve the limits already used by Evolution on the production host.
    mem_limit: 640m
    memswap_limit: 896m

volumes:
  storage_data:
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  pdf_internal:
    internal: true
